# 小说解析 RAG 系统 - 运行配置
# 说明：本文件为配置源；环境变量可覆盖对应项（优先级：环境变量 > 本文件）。
# 开发期可直接改本文件，生产环境建议用环境变量注入敏感信息（如数据库密码、JWT 密钥）。

# 数据库连接（SQLAlchemy 异步 DSN）
database:
  dsn: "postgresql+asyncpg://postgres:root@localhost:5432/story_rag"
  # L1 连接池治理：原 asyncpg 默认 pool_size=5，全流程并发分析易耗尽连接。
  # pool_size=20 + max_overflow=10（上限 30）；pre_ping 规避 PG 服务端断连；
  # pool_recycle=1800s(30min) 回收空闲连接，避免 "server closed the connection"。
  pool_size: 20
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 1800
  pool_pre_ping: true

# L2 异步任务架构：Redis broker + Celery worker（性能跃迁核心）
# 注意：本机 Redis 为 3.2.100 老版本，需 redis-py 以 protocol=2 连接（见 redis_client.py）。
# async_mode=false 表示默认回落串行队列（opt-in）；部署 celery worker 后改为 true。
redis:
  # 本机已启动的 Redis 运行在 6379（老版本 3.2.100，需 protocol=2，见 redis_client.py）。
  # 若另行在 6363 启动 Redis，可改回 6363 或通过环境变量 REDIS_URL 覆盖。
  url: "redis://127.0.0.1:6379/0"
  password: ""

# 混合分析管道调度配置
pipeline:
  async_mode: true           # 启用 Celery 并行（celery worker 已启动；broker=6379 老 Redis）
  worker_concurrency: 8      # 每个 worker 进程并发执行任务数（建议 = CPU 核数）

# 分析模式（极速 / 深度思考）：小说分析的两种入口
#   mode_default: turbo=极速摘要(大上下文少调用，秒~分钟出)，deep=深度全量建库
#   turbo_max_input_chars: 极速单次投喂模型的正文字符上限，模型上下文越大可上调
analysis:
  mode_default: turbo
  turbo_max_input_chars: 120000

# 线程池配置
background:
  thread_pool_size: 20
  task_timeout: 1800
  # 切片嵌入/落库并发与批大小（Chroma-only 流式分批）
  embed_batch: 32                 # 单次嵌入请求携带的文本条数
  embed_concurrency: 12            # 并发嵌入批次上限（信号量，与对外设计口径一致）
  chroma_upsert_batch: 1000        # 每多少条切片执行一次 bulk_insert + Chroma upsert

# JWT 鉴权
jwt:
  secret: "story-rag-dev-secret-change-me"
  algorithm: "HS256"
  expire_minutes: 60
  expire_days: 7              # 访问令牌有效期（天），配合 /auth/refresh 续期

# 上传限制（对齐 API 列表：TXT≤50MB、其他≤200MB、章节≤5000）
upload:
  dir: "uploads"                       # 相对 core 目录；运行时会解析为绝对路径
  max_txt_bytes: 52428800              # 50MB
  max_other_bytes: 209715200           # 200MB
  max_chapters: 5000
  allowed_ext:
    - ".txt"
    - ".epub"
    - ".pdf"
    - ".docx"

# CORS（开发期放开，生产请收紧）
cors:
  origins:
    - "*"

# 向量库（当前 chroma 本地持久化；后续可切 milvus / pgvector，仅改 type 与对应段）
vector_store:
  type: chroma
  chroma:
    persist_dir: "storage/chroma"

# 存储后端（local / minio）；MinIO 已在本地启动（127.0.0.1:9000），恢复使用对象存储。
# 注：残脉逆仙等已有小说上传时即写入 MinIO，切换后端后文件仍可正常读取。
storage:
  backend: minio

# MinIO 对象存储（接入信息）
minio:
  endpoint: "127.0.0.1:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "story-rag"
  secure: false

# --- 混合分析管道配置（M1/M5/M7/M8） ---

# LangChain 接入开关（M1 框架底座 → M8 默认开启）
#   true：走 langchain_factory 路径（ChatOpenAI/ChatOllama），用量自动回写 story_llm_usage
#   false：回退旧 llm_adapters 路径
langchain:
  enabled: true

# LangGraph 工作流编排（）
#   true：走 StateGraph 多步编排（extract→analyze→persist）
#   false：保留 task_service 线性流程
langgraph:
  enabled: true

# LLM 结果缓存（M5 P3 共享缓存）
#   true：启用结果缓存（多 worker 下走 Redis 共享缓存，单 worker 回落进程内 TTLCache），
#         key=(owner_id, novel_id, kind, hash(text))，命中则跳过 LLM 调用省 token/耗时。
#   false：每次重新调 LLM
cache:
  enabled: true
  ttl: 3600                 # 缓存有效期（秒）

# 敏感字段加密密钥（M9 模型 api_key / 后续 MCP 凭据）
#   44字符视为合法 Fernet key 直接使用；否则按内容 sha256 派生
#   留空则自动从 jwt.secret 派生（开发环境可用）
encryption:
  key: ""
