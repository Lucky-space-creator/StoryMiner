# 小说解析 RAG 系统 - 运行配置
# 说明：本文件为配置源；环境变量可覆盖对应项（优先级：环境变量 > 本文件）。
# 开发期可直接改本文件，生产环境建议用环境变量注入敏感信息（如数据库密码、JWT 密钥）。

# 数据库连接（SQLAlchemy 异步 DSN）
database:
  dsn: "postgresql+asyncpg://postgres:root@localhost:5432/story_rag"

# 线程池配置
background:
  thread_pool_size: 20
  task_timeout: 1800
  # 切片嵌入/落库并发与批大小（Chroma-only 流式分批）
  embed_batch: 32                 # 单次嵌入请求携带的文本条数
  embed_concurrency: 8            # 并发嵌入批次上限（信号量）
  chroma_upsert_batch: 1000        # 每多少条切片执行一次 bulk_insert + Chroma upsert

# JWT 鉴权
jwt:
  secret: "story-rag-dev-secret-change-me"
  algorithm: "HS256"
  expire_minutes: 60

# 上传限制（对齐 API 列表：TXT≤50MB、其他≤200MB、章节≤5000）
upload:
  dir: "uploads"                       # 相对 core 目录；运行时会解析为绝对路径
  max_txt_bytes: 52428800              # 50MB
  max_other_bytes: 209715200           # 200MB
  max_chapters: 5000
  allowed_ext:
    - ".txt"
    - ".epub"
    - ".pdf"
    - ".docx"

# CORS（开发期放开，生产请收紧）
cors:
  origins:
    - "*"

# 向量库（当前 chroma 本地持久化；后续可切 milvus / pgvector，仅改 type 与对应段）
vector_store:
  type: chroma
  chroma:
    persist_dir: "storage/chroma"

# 存储后端（local / minio）；MinIO 已在本地启动（127.0.0.1:9000），恢复使用对象存储。
# 注：残脉逆仙等已有小说上传时即写入 MinIO，切换后端后文件仍可正常读取。
storage:
  backend: minio

# MinIO 对象存储（接入信息）
minio:
  endpoint: "127.0.0.1:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "story-rag"
  secure: false

# --- 混合分析管道配置（M1/M5/M7/M8） ---

# LangChain 接入开关（M1 框架底座 → M8 默认开启）
#   true：走 langchain_factory 路径（ChatOpenAI/ChatOllama），用量自动回写 story_llm_usage
#   false：回退旧 llm_adapters 路径
langchain:
  enabled: true

# LangGraph 工作流编排（M7，暂不启用）
#   true：走 StateGraph 多步编排（preprocess→llm_extract→validate→retry→aggregate）
#   false：保留 task_service 线性流程
langgraph:
  enabled: false

# LLM 结果缓存（M5 P3 进程内 TTL）
#   true：启用 cachetools.TTLCache，key=(model, novel_id, stage, hash(text))
#   false：每次重新调 LLM
cache:
  enabled: false
  ttl: 3600                 # 缓存有效期（秒）

# 敏感字段加密密钥（M9 模型 api_key / 后续 MCP 凭据）
#   44字符视为合法 Fernet key 直接使用；否则按内容 sha256 派生
#   留空则自动从 jwt.secret 派生（开发环境可用）
encryption:
  key: ""
